server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml application/octet-stream;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets and 3D binary chunks
    location ~* \.(?:bin|gz|json|js|css|svg|ico|png|jpg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
}
